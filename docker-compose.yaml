services:
  bridge:
    image: zen-bridge:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      GOGC: "100"
      ZEN_BRIDGE_LISTEN: "0.0.0.0:18788"
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-18788}:18788"
    volumes:
      - ./:/config:ro
      - bridge-data:/data
    healthcheck:
      test: ["CMD", "/zen-bridge", "healthcheck", "--url", "http://127.0.0.1:18788/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  bridge-data:
